<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" font-family="Helvetica, Arial, sans-serif">
<title>CircuitCompanion — wiring</title>
<rect width="1400" height="1000" fill="#fbfbf9"/>
<text x="40" y="42" font-size="22" text-anchor="start" font-weight="bold" fill="#212529">CircuitCompanion — wiring</text>
<text x="40" y="64" font-size="13" text-anchor="start" font-weight="normal" fill="#495057">Live talks to the Circuit over DIN MIDI · the Pi only hosts the Circuit's USB for the display</text>
