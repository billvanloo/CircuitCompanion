<polyline points="1070,716 1110,716" fill="none" stroke="#868e96" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/>
<text x="1122" y="720" font-size="12" text-anchor="start" font-weight="normal" fill="#212529">optional / deferred</text>
<text x="40" y="892" font-size="13" text-anchor="start" font-weight="bold" fill="#212529">Notes</text>
<text x="40" y="914" font-size="11.2" text-anchor="start" font-weight="normal" fill="#495057">•  Display power: the 2-pin lead to pins 4/6, or bolt the Pi to the panel's</text>
<text x="40" y="931" font-size="11.2" text-anchor="start" font-weight="normal" fill="#495057">   standoffs and let its contacts take 5 V — one, not both.</text>
<text x="40" y="948" font-size="11.2" text-anchor="start" font-weight="normal" fill="#495057">•  Nothing connects the Pi to the Mac. Live doesn't need the Pi to be running.</text>
<text x="40" y="965" font-size="11.2" text-anchor="start" font-weight="normal" fill="#495057">•  Header pins are physical numbers; GPIO numbers are BCM, as gpiozero uses.</text>
<text x="40" y="982" font-size="11.2" text-anchor="start" font-weight="normal" fill="#495057">•  Check against pinout.xyz and the panel's markings before power-up.</text>
</svg>