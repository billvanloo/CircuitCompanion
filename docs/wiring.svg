<text x="1205" y="170" font-size="12" text-anchor="middle" font-weight="normal" fill="#495057">2014 original · firmware 1.8</text>
<text x="1205" y="192" font-size="12" text-anchor="middle" font-weight="normal" fill="#495057">own power supply, as today</text>
<text x="1080" y="258" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#2b8a3e">MIDI IN</text>
