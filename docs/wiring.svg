<text x="545" y="148" font-size="16" text-anchor="middle" font-weight="bold" fill="#212529">Focusrite Scarlett 6i6</text>
<text x="545" y="170" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#495057">audio + 5-pin MIDI I/O</text>
<text x="470" y="218" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#2b8a3e">MIDI OUT</text>
<text x="620" y="218" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#2b8a3e">MIDI IN</text>
