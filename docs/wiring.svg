<text x="1000" y="920" font-size="10.5" text-anchor="start" font-weight="normal" fill="#868e96">no resistors</text>
<text x="840" y="954" font-size="12.5" text-anchor="start" font-weight="bold" fill="#495057">Phase C (deferred) · 4 tactile buttons</text>
<text x="840" y="970" font-size="11.2" text-anchor="start" font-weight="normal" fill="#495057">GPIO 6 / 13 / 19 / 26 → button → GND (pin 39)</text>
